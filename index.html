<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronômetro HIIT Inteligente</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .digital-font {
      font-family: 'Chakra Petch', monospace, sans-serif;
    }
    /* Suave rotação do anel SVG */
    .circle-progress {
      transition: stroke-dashoffset 0.35s linear, stroke 0.4s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    /* Pulsação nos últimos 3 segundos */
    @keyframes pulse-intense {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .warning-pulse {
      animation: pulse-intense 0.6s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 selection:bg-emerald-500 selection:text-black">

  <!-- Cabeçalho Superior -->
  <header class="w-full max-w-md flex items-center justify-between py-2">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></div>
      <h1 class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
        HIIT PRO TIMER
      </h1>
    </div>
    
    <!-- Controles rápidos: Som e Configurações -->
    <div class="flex items-center space-x-2">
      <button id="toggle-audio-btn" title="Alternar Voz e Sons" class="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/60 hover:bg-slate-700 transition active:scale-95 text-slate-200">
        <svg id="sound-icon-on" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
        </svg>
        <svg id="sound-icon-off" class="w-5 h-5 text-rose-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
        </svg>
      </button>

      <button id="open-config-btn" title="Ajustar Tempos" class="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/60 hover:bg-slate-700 transition active:scale-95 text-slate-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Painel Principal do Cronômetro -->
  <main class="w-full max-w-md flex flex-col items-center justify-center my-auto">
    <!-- Status do Ciclo Atual -->
    <div class="flex items-center gap-2 mb-3 bg-slate-900/90 px-4 py-1.5 rounded-full border border-slate-800">
      <span class="text-xs uppercase tracking-widest text-slate-400 font-bold">Série / Ciclo</span>
      <span id="cycle-display" class="text-sm font-black text-white px-2 py-0.5 rounded bg-slate-800 border border-slate-700">0 / 8</span>
    </div>

    <!-- Indicador de Fase e Display Circular -->
    <div class="relative w-72 h-72 sm:w-80 sm:h-80 flex items-center justify-center">
      <!-- Círculo de Progresso SVG -->
      <svg class="w-full h-full p-2" viewBox="0 0 260 260">
        <!-- Trilha de fundo -->
        <circle cx="130" cy="130" r="115" stroke="currentColor" stroke-width="14" fill="transparent" class="text-slate-900" />
        <!-- Barra animada -->
        <circle id="progress-bar" cx="130" cy="130" r="115" stroke="currentColor" stroke-width="14" stroke-linecap="round" fill="transparent" stroke-dasharray="722.56" stroke-dashoffset="0" class="circle-progress text-amber-500" />
      </svg>

      <!-- Conteúdo Interno do Círculo -->
      <div id="timer-box" class="absolute flex flex-col items-center justify-center text-center transition-all">
        <!-- Badge da Fase Atual -->
        <span id="phase-badge" class="px-3.5 py-1 text-xs font-black uppercase tracking-widest rounded-full mb-1 transition-all bg-amber-500/20 text-amber-400 border border-amber-500/40">
          PRONTO
        </span>

        <!-- Display do Tempo Restante -->
        <span id="time-display" class="digital-font text-6xl sm:text-7xl font-bold tracking-tight text-white drop-shadow-md">
          00:10
        </span>

        <!-- Subtítulo / Próxima Fase -->
        <span id="next-phase-text" class="text-xs font-semibold text-slate-400 mt-2">
          A seguir: Treino (00:30)
        </span>
      </div>
    </div>

    <!-- Resumo dos parâmetros configurados -->
    <div class="grid grid-cols-4 gap-2 w-full mt-6 text-center text-xs">
      <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
        <span class="text-slate-400 block text-[10px] uppercase font-bold">Prep</span>
        <span id="summary-prep" class="font-bold text-amber-400 text-sm">10s</span>
      </div>
      <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
        <span class="text-slate-400 block text-[10px] uppercase font-bold">Treino</span>
        <span id="summary-work" class="font-bold text-emerald-400 text-sm">30s</span>
      </div>
      <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
        <span class="text-slate-400 block text-[10px] uppercase font-bold">Descanso</span>
        <span id="summary-rest" class="font-bold text-cyan-400 text-sm">15s</span>
      </div>
      <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
        <span class="text-slate-400 block text-[10px] uppercase font-bold">Ciclos</span>
        <span id="summary-cycles" class="font-bold text-purple-400 text-sm">8</span>
      </div>
    </div>
  </main>

  <!-- Botões de Ação Inferiores -->
  <footer class="w-full max-w-md pb-4 pt-2">
    <div class="flex items-center gap-3">
      <!-- Botão Resetar -->
      <button id="reset-btn" class="flex-1 py-4 px-4 bg-slate-800/90 hover:bg-slate-700 active:scale-95 transition rounded-2xl font-bold text-slate-300 flex items-center justify-center gap-2 border border-slate-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <span>Reiniciar</span>
      </button>

      <!-- Botão Principal Iniciar / Pausar -->
      <button id="start-btn" class="flex-[2] py-4 px-6 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-95 transition shadow-lg shadow-emerald-500/25 rounded-2xl font-black text-slate-950 text-lg flex items-center justify-center gap-2">
        <svg id="play-icon" class="w-6 h-6 fill-current" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pause-icon" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
        <span id="start-btn-label">COMEÇAR</span>
      </button>
    </div>
  </footer>

  <!-- Modal de Configuração -->
  <div id="config-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl space-y-5 animate-in">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <span>⚙️</span> Configurações de Treino
        </h2>
        <button id="close-config-btn" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="space-y-4">
        <!-- Tempo de Preparação -->
        <div>
          <div class="flex justify-between items-center mb-1 text-sm font-semibold">
            <span class="text-amber-400">Tempo de Preparação (Inicial)</span>
            <span id="val-prep" class="text-slate-300 font-mono">10s</span>
          </div>
          <input id="input-prep" type="range" min="3" max="60" step="1" value="10" class="w-full accent-amber-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
          <p class="text-[11px] text-slate-500 mt-0.5">Ocorre apenas uma vez antes do primeiro ciclo.</p>
        </div>

        <!-- Tempo de Treino -->
        <div>
          <div class="flex justify-between items-center mb-1 text-sm font-semibold">
            <span class="text-emerald-400">Tempo de Treino</span>
            <span id="val-work" class="text-slate-300 font-mono">30s</span>
          </div>
          <input id="input-work" type="range" min="5" max="300" step="5" value="30" class="w-full accent-emerald-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
        </div>

        <!-- Tempo de Descanso -->
        <div>
          <div class="flex justify-between items-center mb-1 text-sm font-semibold">
            <span class="text-cyan-400">Tempo de Descanso</span>
            <span id="val-rest" class="text-slate-300 font-mono">15s</span>
          </div>
          <input id="input-rest" type="range" min="5" max="180" step="5" value="15" class="w-full accent-cyan-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
        </div>

        <!-- Quantidade de Ciclos -->
        <div>
          <div class="flex justify-between items-center mb-1 text-sm font-semibold">
            <span class="text-purple-400">Número de Ciclos / Séries</span>
            <span id="val-cycles" class="text-slate-300 font-mono">8</span>
          </div>
          <input id="input-cycles" type="range" min="1" max="50" step="1" value="8" class="w-full accent-purple-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
        </div>
      </div>

      <!-- Botão Salvar e Fechar -->
      <button id="save-config-btn" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition active:scale-95 mt-4">
        Aplicar e Salvar
      </button>
    </div>
  </div>

  <!-- Script da Aplicação -->
  <script>
    // --- ESTADO INICIAL ---
    const config = {
      prepTime: 10,
      workTime: 30,
      restTime: 15,
      totalCycles: 8,
      soundEnabled: true
    };

    const PHASES = {
      IDLE: 'IDLE',
      PREPARATION: 'PREPARATION',
      WORK: 'WORK',
      REST: 'REST',
      COMPLETED: 'COMPLETED'
    };

    let currentPhase = PHASES.IDLE;
    let currentCycle = 0;
    let timeRemaining = config.prepTime;
    let totalPhaseDuration = config.prepTime;
    let timerInterval = null;
    let isRunning = false;

    // Web Audio Context para bips sintetizados
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Gerador de Bips Sintetizados
    function playBeep(freq = 600, duration = 0.15, type = 'sine') {
      if (!config.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn('Erro ao tocar som:', e);
      }
    }

    // Síntese de Voz (Web Speech API em português)
    function speak(text) {
      if (!config.soundEnabled) return;
      if (!('speechSynthesis' in window)) return;

      try {
        window.speechSynthesis.cancel(); // cancela falas pendentes
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.1; // Ritmo ligeiramente enérgico
        utterance.pitch = 1.0;

        // Procura voz nativa pt-BR se disponível
        const voices = window.speechSynthesis.getVoices();
        const brVoice = voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt_BR'));
        if (brVoice) {
          utterance.voice = brVoice;
        }

        window.speechSynthesis.speak(utterance);
      } catch (err) {
        console.warn('Erro na síntese de voz:', err);
      }
    }

    // Carregar vozes logo no carregamento
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // --- ELEMENTOS DO DOM ---
    const timeDisplay = document.getElementById('time-display');
    const phaseBadge = document.getElementById('phase-badge');
    const nextPhaseText = document.getElementById('next-phase-text');
    const cycleDisplay = document.getElementById('cycle-display');
    const progressBar = document.getElementById('progress-bar');
    const timerBox = document.getElementById('timer-box');

    const startBtn = document.getElementById('start-btn');
    const startBtnLabel = document.getElementById('start-btn-label');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const resetBtn = document.getElementById('reset-btn');

    const toggleAudioBtn = document.getElementById('toggle-audio-btn');
    const soundIconOn = document.getElementById('sound-icon-on');
    const soundIconOff = document.getElementById('sound-icon-off');

    // Elementos do Modal
    const configModal = document.getElementById('config-modal');
    const openConfigBtn = document.getElementById('open-config-btn');
    const closeConfigBtn = document.getElementById('close-config-btn');
    const saveConfigBtn = document.getElementById('save-config-btn');

    const inputPrep = document.getElementById('input-prep');
    const inputWork = document.getElementById('input-work');
    const inputRest = document.getElementById('input-rest');
    const inputCycles = document.getElementById('input-cycles');

    const valPrep = document.getElementById('val-prep');
    const valWork = document.getElementById('val-work');
    const valRest = document.getElementById('val-rest');
    const valCycles = document.getElementById('val-cycles');

    const summaryPrep = document.getElementById('summary-prep');
    const summaryWork = document.getElementById('summary-work');
    const summaryRest = document.getElementById('summary-rest');
    const summaryCycles = document.getElementById('summary-cycles');

    const CIRCUMFERENCE = 2 * Math.PI * 115; // r=115 -> ~722.56
    progressBar.style.strokeDasharray = `${CIRCUMFERENCE}`;

    // --- FORMATAÇÃO & VISUAL ---
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateProgressRing() {
      if (totalPhaseDuration <= 0) {
        progressBar.style.strokeDashoffset = '0';
        return;
      }
      const fraction = timeRemaining / totalPhaseDuration;
      const offset = CIRCUMFERENCE * (1 - fraction);
      progressBar.style.strokeDashoffset = `${offset}`;
    }

    function updateUI() {
      timeDisplay.textContent = formatTime(timeRemaining);
      cycleDisplay.textContent = `${currentCycle} / ${config.totalCycles}`;
      updateProgressRing();

      // Configuração visual por fase
      if (currentPhase === PHASES.IDLE) {
        phaseBadge.textContent = 'PRONTO';
        phaseBadge.className = 'px-3.5 py-1 text-xs font-black uppercase tracking-widest rounded-full mb-1 bg-slate-800 text-slate-300 border border-slate-700';
        progressBar.className.baseVal = 'circle-progress text-slate-700';
        nextPhaseText.textContent = `A seguir: Preparação (${formatTime(config.prepTime)})`;
        timerBox.classList.remove('warning-pulse');
      } else if (currentPhase === PHASES.PREPARATION) {
        phaseBadge.textContent = 'PREPARAÇÃO';
        phaseBadge.className = 'px-3.5 py-1 text-xs font-black uppercase tracking-widest rounded-full mb-1 bg-amber-500/20 text-amber-400 border border-amber-500/50';
        progressBar.className.baseVal = 'circle-progress text-amber-400';
        nextPhaseText.textContent = `A seguir: Treino (${formatTime(config.workTime)})`;
      } else if (currentPhase === PHASES.WORK) {
        phaseBadge.textContent = 'TREINO!';
        phaseBadge.className = 'px-3.5 py-1 text-xs font-black uppercase tracking-widest rounded-full mb-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 shadow-sm shadow-emerald-500/30';
        progressBar.className.baseVal = 'circle-progress text-emerald-400';
        nextPhaseText.textContent = currentCycle < config.totalCycles 
          ? `A seguir: Descanso (${formatTime(config.restTime)})` 
          : 'Último round!';
      } else if (currentPhase === PHASES.REST) {
        phaseBadge.textContent = 'DESCANSO';
        phaseBadge.className = 'px-3.5 py-1 text-xs font-black uppercase tracking-widest rounded-full mb-1 bg-cyan-500/20 text-cyan-400 border border-cyan-500/50';
        progressBar.className.baseVal = 'circle-progress text-cyan-400';
        nextPhaseText.textContent = `A seguir: Treino (Série ${currentCycle + 1})`;
      } else if (currentPhase === PHASES.COMPLETED) {
        phaseBadge.textContent = 'CONCLUÍDO!';
        phaseBadge.className = 'px-3.5 py-1 text-xs font-black uppercase tracking-widest rounded-full mb-1 bg-purple-500/20 text-purple-300 border border-purple-500/50';
        progressBar.className.baseVal = 'circle-progress text-purple-400';
        nextPhaseText.textContent = 'Excelente trabalho! Treino finalizado.';
        timerBox.classList.remove('warning-pulse');
      }

      // Efeito pulsante nos últimos 3 segundos
      if (isRunning && timeRemaining <= 3 && timeRemaining > 0 && currentPhase !== PHASES.COMPLETED) {
        timerBox.classList.add('warning-pulse');
      } else {
        timerBox.classList.remove('warning-pulse');
      }
    }

    // --- MÁQUINA DE ESTADOS DO TIMER ---
    function switchPhase(newPhase) {
      currentPhase = newPhase;

      if (newPhase === PHASES.PREPARATION) {
        totalPhaseDuration = config.prepTime;
        timeRemaining = config.prepTime;
        currentCycle = 1;
        playBeep(440, 0.2, 'triangle');
        speak('Preparação!');
      } else if (newPhase === PHASES.WORK) {
        totalPhaseDuration = config.workTime;
        timeRemaining = config.workTime;
        playBeep(880, 0.35, 'square');
        speak('Treino!');
      } else if (newPhase === PHASES.REST) {
        totalPhaseDuration = config.restTime;
        timeRemaining = config.restTime;
        playBeep(480, 0.25, 'sine');
        speak('Descanso!');
      } else if (newPhase === PHASES.COMPLETED) {
        pauseTimer();
        timeRemaining = 0;
        totalPhaseDuration = 1;
        playBeep(1000, 0.5, 'triangle');
        speak('Treino concluído! Parabéns!');
      }

      updateUI();
    }

    function tick() {
      if (timeRemaining > 1) {
        timeRemaining--;

        // Contagem regressiva nos últimos 3 segundos (3, 2, 1)
        if (timeRemaining <= 3) {
          playBeep(650, 0.15, 'sine');
          speak(String(timeRemaining));
        }
      } else {
        // Transição de fase
        if (currentPhase === PHASES.PREPARATION) {
          switchPhase(PHASES.WORK);
        } else if (currentPhase === PHASES.WORK) {
          if (currentCycle < config.totalCycles) {
            switchPhase(PHASES.REST);
          } else {
            switchPhase(PHASES.COMPLETED);
          }
        } else if (currentPhase === PHASES.REST) {
          currentCycle++;
          switchPhase(PHASES.WORK);
        }
      }
      updateUI();
    }

    function startTimer() {
      getAudioContext(); // inicializa áudio com o clique do usuário

      if (currentPhase === PHASES.IDLE || currentPhase === PHASES.COMPLETED) {
        switchPhase(PHASES.PREPARATION);
      }

      isRunning = true;
      clearInterval(timerInterval);
      timerInterval = setInterval(tick, 1000);

      startBtnLabel.textContent = 'PAUSAR';
      playIcon.classList.add('hidden');
      pauseIcon.classList.remove('hidden');
      startBtn.classList.replace('from-emerald-500', 'from-amber-500');
      startBtn.classList.replace('to-teal-500', 'to-orange-500');
      startBtn.classList.replace('shadow-emerald-500/25', 'shadow-amber-500/25');
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);

      startBtnLabel.textContent = currentPhase === PHASES.COMPLETED ? 'RECOMEÇAR' : 'RETOMAR';
      playIcon.classList.remove('hidden');
      pauseIcon.classList.add('hidden');
      startBtn.classList.replace('from-amber-500', 'from-emerald-500');
      startBtn.classList.replace('to-orange-500', 'to-teal-500');
      startBtn.classList.replace('shadow-amber-500/25', 'shadow-emerald-500/25');
      timerBox.classList.remove('warning-pulse');
    }

    function resetTimer() {
      pauseTimer();
      currentPhase = PHASES.IDLE;
      currentCycle = 0;
      timeRemaining = config.prepTime;
      totalPhaseDuration = config.prepTime;
      startBtnLabel.textContent = 'COMEÇAR';
      updateUI();
    }

    // --- CONTROLE DE CONFIGURAÇÕES ---
    function syncConfigInputs() {
      inputPrep.value = config.prepTime;
      inputWork.value = config.workTime;
      inputRest.value = config.restTime;
      inputCycles.value = config.totalCycles;

      valPrep.textContent = `${config.prepTime}s`;
      valWork.textContent = `${config.workTime}s`;
      valRest.textContent = `${config.restTime}s`;
      valCycles.textContent = config.totalCycles;

      summaryPrep.textContent = `${config.prepTime}s`;
      summaryWork.textContent = `${config.workTime}s`;
      summaryRest.textContent = `${config.restTime}s`;
      summaryCycles.textContent = config.totalCycles;
    }

    function updateConfigValues() {
      config.prepTime = parseInt(inputPrep.value, 10);
      config.workTime = parseInt(inputWork.value, 10);
      config.restTime = parseInt(inputRest.value, 10);
      config.totalCycles = parseInt(inputCycles.value, 10);
      syncConfigInputs();
      if (!isRunning) {
        resetTimer();
      }
    }

    // --- LISTENERS DE EVENTOS ---
    startBtn.addEventListener('click', () => {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);

    toggleAudioBtn.addEventListener('click', () => {
      config.soundEnabled = !config.soundEnabled;
      if (config.soundEnabled) {
        soundIconOn.classList.remove('hidden');
        soundIconOff.classList.add('hidden');
        playBeep(700, 0.1);
      } else {
        soundIconOn.classList.add('hidden');
        soundIconOff.classList.remove('hidden');
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    });

    // Modal
    openConfigBtn.addEventListener('click', () => {
      syncConfigInputs();
      configModal.classList.remove('hidden');
    });

    closeConfigBtn.addEventListener('click', () => {
      configModal.classList.add('hidden');
    });

    saveConfigBtn.addEventListener('click', () => {
      updateConfigValues();
      configModal.classList.add('hidden');
    });

    // Sliders interativos
    inputPrep.addEventListener('input', (e) => { valPrep.textContent = `${e.target.value}s`; });
    inputWork.addEventListener('input', (e) => { valWork.textContent = `${e.target.value}s`; });
    inputRest.addEventListener('input', (e) => { valRest.textContent = `${e.target.value}s`; });
    inputCycles.addEventListener('input', (e) => { valCycles.textContent = e.target.value; });

    // Fechar modal ao clicar fora
    configModal.addEventListener('click', (e) => {
      if (e.target === configModal) {
        configModal.classList.add('hidden');
      }
    });

    // Inicialização
    syncConfigInputs();
    resetTimer();
  </script>
</body>
</html>
